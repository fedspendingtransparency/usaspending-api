name: Build USA Spending Docker Image for Test

on:
  workflow_call:
  # Runs against the default branch (master) on a schedule to keep the GHA build-cache warm,
  # since PR branches without their own cache fall back to master's. Also guards against the
  # 7-day idle-eviction GitHub applies to unused cache entries.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  Run:
    name: Run
    runs-on: ${{ vars.RUNNER_VERSION }}
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Create .env for docker compose
        run: cp .env.template .env

      - name: Export build args from .env
        run: grep -E '^(PROJECT_LOG_DIR|SPARK_LOGGING_LEVEL)=' .env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./development.Dockerfile
          tags: usaspending-development:latest
          build-args: |
            PROJECT_LOG_DIR=${{ env.PROJECT_LOG_DIR }}
            SPARK_LOGGING_LEVEL=${{ env.SPARK_LOGGING_LEVEL }}
          outputs: type=docker,dest=/tmp/usaspending-development.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scheduled runs exist only to refresh the cache on master; nothing consumes their artifact.
      - name: Upload Artifact
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: usaspending-development-image
          path: /tmp/usaspending-development.tar
