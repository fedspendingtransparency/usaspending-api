name: Code Style Checks

env:
  BROKER_DB_HOST: usaspending-db
  BROKER_DB_PORT: 5432
  BROKER_DB_USER: admin
  BROKER_DB_PASSWORD: root
  BROKER_DB_NAME: data_broker
  DJANGO_SETTINGS_MODULE: usaspending_api.settings
  ES_SCHEME: http
  ES_HOST: usaspending-es
  ES_PORT: 9200
  RUSTFS_HOST: usaspending-s3
  USASPENDING_DB_HOST: usaspending-db
  USASPENDING_DB_PORT: 5432
  USASPENDING_DB_USER: usaspending
  USASPENDING_DB_PASSWORD: usaspender
  USASPENDING_DB_NAME: data_store_api
  IS_LOCAL: true

on:
  workflow_call:

jobs:
  Run:
    # These checks are not broken out into multiple jobs because the steps to prepare the environment
    # take the bulk of the time. Running them in parallel saves minimal time at the cost of using more
    # runners than needed.
    name: Run
    runs-on: ${{ vars.RUNNER_VERSION }}
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Download USAspending Docker Image
        uses: actions/download-artifact@v4
        with:
          name: usaspending-development-image
          path: /tmp

      - name: Load USAspending Docker Image
        shell: bash
        run: docker load --input /tmp/usaspending-development.tar

      - name: Create .env for docker compose
        shell: bash
        run: cp .env.template .env

      - name: Build container for DB
        shell: bash
        run: docker compose up -d usaspending-db

      - name: Get Changed Python Files
        id: changed-python-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
        with:
          files: |
            **.py
          files_ignore: |
            **/migrations/**
          separator: " "

      - name: Check If `changed-python-files` Is An Empty String
        if: steps.changed-python-files.outputs.all_changed_files == ''
        run: echo "No changed files detected"

      # changed-python-files could be an empty string, which would cause `ruff check` to be run against the entire project.
      - name: Run Ruff Linter
        if: steps.changed-python-files.outputs.all_changed_files != ''
        run: docker compose run --rm usaspending-adhoc ruff check ${{ steps.changed-python-files.outputs.all_changed_files }}

      - name: Run Ruff Formatter
        if: steps.changed-python-files.outputs.all_changed_files != ''
        run: docker compose run --rm usaspending-adhoc ruff format --check ${{ steps.changed-python-files.outputs.all_changed_files }}

      # TODO: Should rethink placement of this check. This runs as a Django management command which requires similar
      #       setup steps as the rest of the test suite. Removing would reduce setup time and overall CI/CD time.
      - name: Run Check For Endpoint Documentation
        run: |
          ttl=30; container_name="usaspending-db"; echo "Wait for $container_name to be healthy for $ttl seconds"; until [ $ttl -le 0 ] || [ "$(docker inspect $container_name --format='{{.State.Health.Status}}')" = "healthy" ]; do echo $ttl; ((ttl--)); sleep 1; done; [ $ttl -gt 0 ]
          docker compose run --rm usaspending-manage check_for_endpoint_documentation

      - name: Run Dredd
        env:
          # dredd-hooks (unmaintained since 2018) imports the `imp` module, removed in Python 3.12; patches/imp.py shims it
          PYTHONPATH: patches
        run: docker compose run --rm usaspending-adhoc dredd > dredd-results.txt && echo '! grep -E "^[warn:|error:]" dredd-results.txt' | bash
